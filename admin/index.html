<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>About To Shine — Admin Panel</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />

  <style>
    :root{
      --purple:#5b2a86;
      --blue:#2f7bdc;
      --yellow:#FFD84D;
      --ink:#111827;
      --muted:#e5e7eb;
      --card:rgba(255,255,255,.12);
      --border:rgba(255,255,255,.22);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, var(--purple), var(--blue));
      color:#fff;
      min-height:100vh;
    }

    .topbar{
      padding:18px;
      display:flex;
      align-items:center;
      gap:14px;
    }

    .sun{
      width:44px;
      height:44px;
      border-radius:14px;
      background: rgba(255,255,255,.18);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      border:1px solid var(--border);
    }

    .title{
      font-weight:900;
      font-size:18px;
      line-height:1.1;
    }

    .subtitle{
      font-size:12px;
      opacity:.9;
      margin-top:4px;
    }

    .accent{
      height:4px;
      background:var(--yellow);
      border-radius:999px;
      margin:0 18px;
    }

    .wrap{
      max-width:1100px;
      margin:0 auto;
      padding:18px;
    }

    .status{
      background: rgba(255,255,255,.12);
      border:1px solid var(--border);
      border-radius:14px;
      padding:14px;
      margin:16px 0;
      font-size:14px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, 1fr);
      gap:16px;
    }

    @media (max-width:900px){
      .grid{ grid-template-columns:1fr; }
    }

    .card{
      background: var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px;
      backdrop-filter: blur(10px);
    }

    .card h3{
      margin:0 0 6px;
      font-size:16px;
      font-weight:900;
    }

    .card p{
      margin:0 0 12px;
      font-size:13px;
      opacity:.9;
      line-height:1.4;
    }

    .btn{
      width:100%;
      padding:12px;
      border-radius:12px;
      font-weight:900;
      border:0;
      cursor:pointer;
      background:var(--yellow);
      color:#111;
      text-decoration:none;
      text-align:center;
      display:block;
    }

    .btn.secondary{
      background: rgba(0,0,0,.25);
      color:#fff;
      border:1px solid var(--border);
    }

    .hidden{ display:none; }

    .footerNote{
      font-size:12px;
      opacity:.7;
      margin-top:18px;
      word-break:break-word;
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <div class="topbar">
    <div class="sun">☀︎</div>
    <div>
      <div class="title">About To Shine Cleaning</div>
      <div class="subtitle">Admin Panel (NFC Protected)</div>
    </div>
  </div>

  <div class="accent"></div>

  <!-- CONTENT -->
  <div class="wrap">

    <div class="status" id="status">
      Loading secure access…
    </div>

    <div class="grid hidden" id="cards">

      <div class="card">
        <h3>Employee Clock</h3>
        <p>Open the employee clock system.</p>
        <a class="btn" id="clockBtn" href="#">Open Clock</a>
      </div>

      <div class="card">
        <h3>Residential Estimator</h3>
        <p>Walkthrough estimator (admin only).</p>
        <button class="btn secondary" disabled>Coming Soon</button>
      </div>

      <div class="card">
        <h3>Admin Tools</h3>
        <p>Payroll, schedules, reports.</p>
        <button class="btn secondary" disabled>Coming Soon</button>
      </div>

    </div>

    <div class="footerNote" id="debug"></div>

  </div>

  <!-- IMPORTANT: ADMIN LOGIC -->
  <script src="./admin.js?v=1"></script>

</body>
</html>
