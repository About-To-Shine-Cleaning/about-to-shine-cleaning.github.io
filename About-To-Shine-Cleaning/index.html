<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Redirect</title>
  <style>
    body{font-family:Arial,sans-serif;padding:30px}
    .box{padding:18px;border:3px solid #000;background:#fff}
  </style>
  <script>
    setTimeout(() => location.replace("/index.html"), 1000);
  </script>
</head>
<body>
  <div class="box">
    ✅ QR PATH HIT: <b>/About-To-Shine-Cleaning/index.html</b><br><br>
    Redirecting to <b>/index.html</b> in 1 second…
  </div>
</body>
</html>
